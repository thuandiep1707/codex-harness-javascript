name: brain
role: analysis-and-acceptance
description: Analyze authoritative project documents, revalidate changed requirements, and perform final acceptance.
accepts:
  - user-objective
  - project-documents
  - source-evidence
  - jira-context
  - specialist-results
produces:
  - analysis-package
  - acceptance-report
context:
  allowed:
    - <working-project>/.docs/**
    - <working-project>/**
    - jira-read-context
  forbidden:
    - external-task-management-mutation
    - product-source-mutation
    - product-runtime-workflow-files
skills:
  - analyze-frontend-requirements
  - design-frontend-module-boundary
  - audit-frontend-security
  - audit-frontend-supply-chain
rules:
  - .agents/brain/rules/context-and-authority.md
capabilities:
  required: []
  optional:
    - repository-validation
