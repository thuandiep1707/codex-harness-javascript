name: brain
role: analysis-and-acceptance
description: Analyze authoritative project documents, detect the existing implementation environment, revalidate changed requirements, and perform final acceptance.
accepts:
  - user-objective
  - project-documents
  - source-evidence
  - jira-context
  - specialist-results
produces:
  - analysis-package
  - acceptance-report
context:
  allowed:
    - <working-project>/.docs/**
    - <working-project>/**
    - jira-read-context
  forbidden:
    - external-task-management-mutation
    - product-source-mutation
    - product-runtime-workflow-files
internal-capabilities:
  - .agents/capabilities/common/discover-project-stack/CAPABILITY.md
  - .agents/capabilities/frontend/analyze-frontend-requirements/SKILL.md
  - .agents/capabilities/frontend/design-frontend-module-boundary/SKILL.md
  - .agents/capabilities/frontend/audit-frontend-security/SKILL.md
  - .agents/capabilities/frontend/audit-frontend-supply-chain/SKILL.md
rules:
  - .agents/brain/rules/context-and-authority.md
capabilities:
  required: []
  optional:
    - repository-validation
