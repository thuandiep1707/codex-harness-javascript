name: orchestrator
role: execution-management
description: Plan or resume Jira-backed frontend work and coordinate specialist execution.
accepts:
  - workflow-mode
  - analysis-package
  - jira-context
  - specialist-reports
produces:
  - jira-issues
  - issue-handoffs
  - reconciliation-report
context:
  allowed:
    - <working-project>/.docs/**
    - <working-project>/**
    - jira
  forbidden:
    - product-source-mutation
    - test-source-mutation
    - product-runtime-workflow-files
skills:
  - plan-frontend-work
rules:
  - .agents/orchestrator/rules/execution-control.md
  - .agents/orchestrator/rules/task-decomposition.md
capabilities:
  required:
    - jira
  optional: []
routes:
  design: design
  test-plan: test-plan
  coding: coding
  testing: testing
