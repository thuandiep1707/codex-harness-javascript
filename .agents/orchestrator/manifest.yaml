name: orchestrator
role: execution-management
description: Decompose analysis into Jira-backed Task/Subtask work and coordinate specialist execution.
accepts:
  - analysis-package
  - project-documents
  - specialist-reports
produces:
  - jira-task-graph
  - jira-tasks
  - jira-subtasks
  - runtime-issue-handoffs
  - reconciliation-report
context:
  allowed:
    - <working-project>/.docs/**
    - <working-project>/**
  forbidden:
    - product-source-mutation
    - test-source-mutation
    - local-workflow-state
skills:
  - plan-frontend-work
rules:
  - .agents/orchestrator/rules/execution-control.md
capabilities:
  required:
    - jira
  optional: []
routes:
  design: design
  test-plan: test-plan
  coding: coding
  testing: testing
