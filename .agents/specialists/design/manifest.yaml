name: design
role: design-provider-specialist
description: Produce traceable external design evidence from one bounded specialist Subtask using only routed internal capabilities.
accepts:
  - issue-handoff
produces:
  - design-artifact
  - agent-report
context:
  allowed:
    - transient-issue-handoff
    - design-provider-state
  forbidden:
    - <working-project>/.docs/**
    - <working-project>/source-mutation
    - jira-mutation
internal-capabilities:
  - .agents/capabilities/frontend/orchestrate-frontend-design/SKILL.md
rules:
  - .agents/specialists/design/rules/context-boundary.md
capabilities:
  required:
    - design-provider
  optional: []
