name: testing
role: test-implementation-specialist
description: Implement and execute bounded frontend tests for one specialist Subtask using only routed internal capabilities.
accepts:
  - issue-handoff
  - test-plan-artifact
  - product-source
  - test-runner-configuration
produces:
  - test-code-change
  - test-report
  - agent-report
  - runtime-resource-events
context:
  allowed:
    - transient-issue-handoff
    - approved-test-plan-evidence
    - <working-project>/**
  forbidden:
    - <working-project>/.docs/**
    - jira-mutation
internal-capabilities:
  - .agents/capabilities/frontend/testing/CAPABILITY.md
rules:
  - .agents/specialists/testing/rules/context-boundary.md
  - .agents/rules/testing.md
  - .agents/rules/runtime-resource-lifecycle.md
capabilities:
  required:
    - workspace-read
    - workspace-write
    - test-runner
  optional:
    - browser
