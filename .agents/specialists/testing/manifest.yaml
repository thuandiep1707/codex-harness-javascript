name: testing
role: test-implementation-specialist
description: Implement and execute one bounded frontend testing Jira Subtask from approved runtime artifacts.
accepts:
  - issue-handoff
  - test-plan-artifact
  - product-source
  - test-runner-configuration
produces:
  - test-code-change
  - test-report
  - agent-report
context:
  allowed:
    - runtime-issue-handoff
    - runtime-test-plan-artifact
    - <working-project>/**
  forbidden:
    - <working-project>/.docs/**
    - local-workflow-state
skills:
  - testing
rules:
  - .agents/specialists/testing/rules/context-boundary.md
  - .agents/rules/testing.md
capabilities:
  required:
    - workspace-read
    - workspace-write
    - test-runner
  optional:
    - browser
