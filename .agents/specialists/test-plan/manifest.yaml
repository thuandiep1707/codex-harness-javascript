name: test-plan
role: test-planning-specialist
description: Produce a bounded risk-based test plan from one Jira Subtask handoff.
accepts:
  - issue-handoff
produces:
  - test-plan-artifact
  - agent-report
context:
  allowed:
    - runtime-issue-handoff
  forbidden:
    - <working-project>/.docs/**
    - <working-project>/source-inspection
    - <working-project>/source-mutation
    - local-workflow-state
skills:
  - plan-frontend-testing
rules:
  - .agents/specialists/test-plan/rules/context-boundary.md
capabilities:
  required: []
  optional: []
