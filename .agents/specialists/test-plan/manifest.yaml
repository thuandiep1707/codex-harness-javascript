name: test-plan
role: developer-self-verification-planner
description: Decide the smallest developer self-test route and scope for one Coding execution unit from bounded relevant docs plus the actual source change.
accepts:
  - verification-handoff
  - implementation-report
  - previous-test-plan
  - previous-test-reports
produces:
  - test-plan-artifact
  - agent-report
context:
  allowed:
    - transient-verification-handoff
    - handoff-listed-relevant-documents
    - bounded-source-diff
    - bounded-source-read
    - implementation-evidence
    - prior-verification-evidence
  forbidden:
    - unbounded-document-scan
    - unbounded-source-archaeology
    - product-source-mutation
    - test-source-mutation
    - jira-mutation
internal-capabilities:
  - .agents/capabilities/frontend/plan-frontend-testing/CAPABILITY.md
rules:
  - .agents/specialists/test-plan/rules/context-boundary.md
capabilities:
  required:
    - workspace-read
  optional: []
