name: test-plan
role: test-planning-specialist
description: Produce a bounded risk-based test plan for one specialist Subtask using only routed internal capabilities.
accepts:
  - issue-handoff
produces:
  - test-plan-artifact
  - agent-report
context:
  allowed:
    - transient-issue-handoff
  forbidden:
    - <working-project>/.docs/**
    - <working-project>/source-inspection
    - <working-project>/source-mutation
    - jira-mutation
internal-capabilities:
  - .agents/capabilities/frontend/plan-frontend-testing/SKILL.md
rules:
  - .agents/specialists/test-plan/rules/context-boundary.md
capabilities:
  required: []
  optional: []
