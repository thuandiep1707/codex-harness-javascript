name: coding
role: frontend-implementation-specialist
description: Implement one bounded Next.js frontend Jira Subtask from approved runtime handoffs and design artifacts.
accepts:
  - issue-handoff
  - design-artifact
  - product-source
produces:
  - source-code-change
  - implementation-report
  - agent-report
context:
  allowed:
    - runtime-issue-handoff
    - runtime-design-artifact
    - <working-project>/**
  forbidden:
    - <working-project>/.docs/**
    - local-workflow-state
skills:
  - migrate-legacy-frontend-module
  - integrate-third-party-frontend
  - nextjs-state-management
  - nextjs-tanstack-query
  - shadcn
rules:
  - .agents/specialists/coding/rules/context-boundary.md
  - .agents/rules/frontend-coding.md
  - .agents/rules/frontend/atomic-components.md
capabilities:
  required:
    - workspace-read
    - workspace-write
  optional:
    - browser
