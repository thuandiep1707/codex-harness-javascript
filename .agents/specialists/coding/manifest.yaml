name: coding
role: frontend-implementation-specialist
description: Implement one bounded frontend specialist Subtask from a transient Jira-derived handoff.
accepts:
  - issue-handoff
  - design-artifact
  - product-source
produces:
  - source-code-change
  - implementation-report
  - agent-report
context:
  allowed:
    - transient-issue-handoff
    - approved-dependency-evidence
    - <working-project>/**
  forbidden:
    - <working-project>/.docs/**
    - jira-mutation
skills:
  - migrate-legacy-frontend-module
  - integrate-third-party-frontend
  - nextjs-state-management
  - nextjs-tanstack-query
  - shadcn
rules:
  - .agents/specialists/coding/rules/context-boundary.md
  - .agents/specialists/coding/rules/component-decomposition-gate.md
  - .agents/rules/frontend-coding.md
capabilities:
  required:
    - workspace-read
    - workspace-write
  optional:
    - browser
