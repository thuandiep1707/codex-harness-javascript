name: coding
role: frontend-implementation-specialist
description: Implement one bounded frontend specialist Subtask from a transient Jira-derived handoff using only the internal capabilities selected for this Subtask.
accepts:
  - issue-handoff
  - design-artifact
  - product-source
produces:
  - source-code-change
  - implementation-report
  - agent-report
context:
  allowed:
    - transient-issue-handoff
    - approved-dependency-evidence
    - <working-project>/**
  forbidden:
    - <working-project>/.docs/**
    - jira-mutation
internal-capabilities:
  - .agents/capabilities/frontend/migrate-legacy-frontend-module/SKILL.md
  - .agents/capabilities/frontend/integrate-third-party-frontend/SKILL.md
  - .agents/capabilities/frontend/nextjs-state-management/SKILL.md
  - .agents/capabilities/frontend/nextjs-tanstack-query/SKILL.md
  - .agents/capabilities/frontend/shadcn/SKILL.md
rules:
  - .agents/specialists/coding/rules/context-boundary.md
  - .agents/specialists/coding/rules/component-decomposition-gate.md
  - .agents/rules/frontend-coding.md
capabilities:
  required:
    - workspace-read
    - workspace-write
  optional:
    - browser
