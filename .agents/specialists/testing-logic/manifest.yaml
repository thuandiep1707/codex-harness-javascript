name: testing-logic
role: logic-test-specialist
description: Implement and execute bounded unit, component, and integration tests without a real browser.
accepts:
  - issue-handoff
  - test-plan-artifact
  - product-source
  - test-runner-configuration
produces:
  - test-code-change
  - test-report
  - agent-report
context:
  allowed:
    - transient-issue-handoff
    - approved-test-plan-evidence
    - <working-project>/**
  forbidden:
    - <working-project>/.docs/**
    - jira-mutation
internal-capabilities:
  - .agents/capabilities/frontend/testing/CAPABILITY.md
rules:
  - .agents/rules/testing.md
  - .agents/rules/runtime-resource-lifecycle.md
capabilities:
  required:
    - workspace-read
    - workspace-write
    - test-runner
