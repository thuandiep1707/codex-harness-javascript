name: testing-logic
role: developer-logic-self-test
description: Execute bounded non-browser developer self-verification for one parent Coding execution unit according to the current Test Plan.
accepts:
  - verification-handoff
  - test-plan-artifact
  - product-source
  - test-runner-configuration
produces:
  - test-code-change
  - test-report
  - agent-report
  - runtime-resource-events
context:
  allowed:
    - transient-verification-handoff
    - approved-test-plan-evidence
    - bounded-product-source
    - existing-logic-tests
    - test-runner-configuration
  forbidden:
    - <working-project>/.docs/**
    - jira-mutation
    - production-source-mutation
internal-capabilities:
  - .agents/capabilities/frontend/testing/CAPABILITY.md
rules:
  - .agents/rules/testing.md
  - .agents/rules/runtime-resource-lifecycle.md
capabilities:
  required:
    - workspace-read
    - workspace-write
    - test-runner
