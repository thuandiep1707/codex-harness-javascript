name: testing-ui
role: developer-ui-self-test
description: Execute one aggregated end-to-end real-browser self-verification gate for a functional slice from all contributing UI-relevant Test Plans.
accepts:
  - verification-handoff
  - durable-ui-verification-targets
  - product-source
  - test-runner-configuration
produces:
  - test-code-change
  - test-report
  - agent-report
  - runtime-resource-events
context:
  allowed:
    - transient-verification-handoff
    - approved-test-plan-evidence
    - bounded-product-source
    - existing-ui-tests
    - browser-configuration
  forbidden:
    - <working-project>/.docs/**
    - jira-mutation
    - production-source-mutation
internal-capabilities: []
rules:
  - .agents/rules/testing.md
  - .agents/rules/runtime-resource-lifecycle.md
capabilities:
  required:
    - workspace-read
    - workspace-write
    - test-runner
    - browser
