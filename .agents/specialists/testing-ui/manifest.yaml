name: testing-ui
role: ui-test-specialist
description: Execute bounded real-browser UI validation and Playwright tests.
accepts:
  - issue-handoff
  - test-plan-artifact
  - product-source
  - test-runner-configuration
produces:
  - test-code-change
  - test-report
  - agent-report
  - runtime-resource-events
context:
  allowed:
    - transient-issue-handoff
    - approved-test-plan-evidence
    - <working-project>/**
  forbidden:
    - <working-project>/.docs/**
    - jira-mutation
internal-capabilities: []
rules:
  - .agents/rules/testing.md
  - .agents/rules/runtime-resource-lifecycle.md
capabilities:
  required:
    - workspace-read
    - workspace-write
    - test-runner
    - browser
